<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explora Otros Mundos</title>
  <style>
    /* Fondo oscuro idéntico a tu interfaz para que resalte el brillo */
    body {
      background-color: #0b0e14; 
      color: #ffffff;
      font-family: sans-serif;
      margin: 0;
      padding: 40px;
    }

    h2 {
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 40px;
      font-size: 24px;
      text-align: center;
    }

    /* CONTENEDOR DE LA GRILLA 
       Totalmente limpio: sin bordes, sin fondos, sin recuadros.
    */
    .grid-proyectos {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 columnas perfectamente alineadas */
      gap: 45px;                             /* Espacio libre entre logos */
      max-width: 1200px;
      margin: 0 auto;
      justify-items: center;
      align-items: center;
    }

    /* Enlaces contenedores de las imágenes */
    .logo-item {
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      width: 100%;
      height: 160px; /* Contenedor invisible para mantener simetría */
    }

    /* ESTADO BASE DE LOS LOGOS (PNGs)
    */
    .logo-item img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      display: block;
      
      /* Filtro inicial: Podés darles un toque de opacidad si querés que resalten más al hacer hover */
      opacity: 0.85; 

      /* Transición fluida para que el tamaño y el brillo aparezcan suavemente */
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), 
                  filter 0.3s ease, 
                  opacity 0.3s ease; 
    }

    /* ===================================================
       EFECTO HOVER: BRILLO EN EL CONTORNO DEL PNG
       ===================================================
    */
    .logo-item:hover img {
      opacity: 1; /* Se vuelve 100% nítido */
      
      /* Aumenta un poquitito de tamaño de forma sutil */
      transform: scale(1.06); 
      
      /* drop-shadow hace que el contorno exacto del dibujo brille.
         Parámetros: (0 desplazamiento X, 0 desplazamiento Y, 15px de radio de difuminado, color amarillo traslúcido)
      */
      filter: drop-shadow(0 0 15px rgba(255, 225, 100, 0.85)) 
              drop-shadow(0 0 5px rgba(255, 200, 50, 0.4)); /* Doble capa de brillo para más intensidad */
    }

    /* Diseño adaptativo para pantallas más chicas (Celulares / Tablets) */
    @media (max-width: 900px) {
      .grid-proyectos {
        grid-template-columns: repeat(2, 1fr);
        gap: 30px;
      }
    }
  </style>
</head>
<body>

  <h2>Explora Otros Mundos</h2>

  <div class="grid-proyectos">
