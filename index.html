<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explora Otros Mundos</title>
  <style>
    /* Fondo oscuro para que resalte la iluminación (puedes cambiarlo por tu fondo original) */
    body {
      background-color: #121214; 
      color: #ffffff;
      font-family: sans-serif;
      margin: 0;
      padding: 40px;
    }

    h2 {
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 30px;
      font-size: 24px;
    }

    /* Contenedor principal en cuadrícula (sin recuadros) */
    .grid-proyectos {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 columnas fijas */
      gap: 40px;                             /* Espacio generoso entre logos */
      max-width: 1200px;
      margin: 0 auto;
      justify-items: center;
      align-items: center;
    }

    /* Estilo para los enlaces de los logos */
    .logo-item {
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      width: 100%;
      height: 150px; /* Altura máxima controlada para alineación homogénea */
    }

    /* Comportamiento base de las imágenes de los logos */
    .logo-item img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
      display: block;
      
      /* Transición suave para que la animación no sea brusca */
      transition: transform 0.3s ease, filter 0.3s ease; 
    }

    /* ==========================================
       EFECTO INTERACTIVO AL PASAR EL MOUSE (HOVER)
       ========================================== */
    .logo-item:hover img {
      /* Aumenta un poquitito de tamaño (8% extra) */
      transform: scale(1.08); 
      
      /* Crea la iluminación sutil amarilla siguiendo la silueta del PNG transparente */
      filter: drop-shadow(0 0 15px rgba(255, 235, 120, 0.75)); 
    }

    /* Responsivo: Si la pantalla es más chica (celulares), pasa a 2 columnas */
    @media (max-width: 768px) {
      .grid-proyectos {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
    }
  </style>
</head>
<body>

  <h2>Explora Otros Mundos</h2>

  <div class="grid-proyectos">
    
    <a href="#" class="logo-item">
      <img src="sweet_escape.png" alt="Sweet Escape">
    </a>
    <a href="#" class="logo-item">
      <img src="out_of_the_bounds.png" alt="Out of the Bounds">
    </a>
    <a href="#" class="logo-item">
      <img src="intrusion.png" alt="Intrusion">
    </a>
    <a href="#" class="logo-item">
      <img src="echoes.png" alt="Echoes">
    </a>

    <a href="#" class="logo-item">
      <img src="bee_coming.png" alt="Bee Coming">
    </a>
    <a href="#" class="logo-item">
      <img src="to_space_and_back.png" alt="To Space and Back">
    </a>
    <a href="#" class="logo-item">
      <img src="glitch_alley.png" alt="Glitch Alley">
    </a>
    <a href="#" class="logo-item">
      <img src="umbra.png" alt="Umbra">
    </a>

    <a href="#" class="logo-item">
      <img src="patocalipsis.png" alt="Patocalipsis">
    </a>
    <a href="#" class="logo-item">
      <img src="feel_better_abyss.png" alt="Feel Better Abyss">
    </a>
    <a href="#" class="logo-item">
      <img src="proyecto_engranaje.png" alt="Proyecto 11">

</body>
</html>
